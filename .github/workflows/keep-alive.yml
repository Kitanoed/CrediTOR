# ──────────────────────────────────────────────────────────
# Keep-Alive Pinger  –  prevents Render free-tier spin-down
#
# Render shuts down free web services after ~15 min of no
# inbound HTTP requests. This workflow fires every 14 min
# and hits the /api/health endpoint so the backend never
# goes to sleep.
#
# GitHub Actions cron has ±5 min jitter, but 14-min intervals
# are tight enough to always beat the 15-min window.
# ──────────────────────────────────────────────────────────

name: Keep Alive

on:
  schedule:
    # Every 14 minutes  (GitHub may add up to 5 min jitter)
    - cron: "*/14 * * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      # Resolve GitHub vars here (valid in env block); shell steps use $BACKEND_URL etc.
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://creditor-i1pg.onrender.com' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || '' }}

    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend at $(date -u)"
          CURL_EXIT=0
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            "${BACKEND_URL}/api/health") || CURL_EXIT=$?
          if [ "$CURL_EXIT" -eq 28 ]; then
            echo "Request timed out (exit 28) - Render is cold-starting, ping was still sent"
          elif [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl error (exit $CURL_EXIT) - network issue, skipping"
          elif [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Backend is alive (HTTP $STATUS)"
          else
            echo "Backend returned HTTP $STATUS - it may still be waking up"
          fi

      - name: Ping frontend (warm edge cache)
        run: |
          if [ -n "${FRONTEND_URL}" ]; then
            echo "Pinging frontend at $(date -u)"
            CURL_EXIT=0
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "${FRONTEND_URL}") || CURL_EXIT=$?
            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "Frontend curl error (exit $CURL_EXIT) - skipping"
            else
              echo "Frontend responded with HTTP $STATUS"
            fi
          else
            echo "FRONTEND_URL not set - skipping (Vercel does not cold-start anyway)"
          fi
