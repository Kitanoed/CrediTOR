server.port=8081
spring.application.name=creditor

# ===================================================================
# DATABASE CONFIGURATION (Supabase via PostgreSQL)
# ===================================================================
# Your complete Supabase JDBC URL with the required SSL mode enabled
# prepareThreshold=0 avoids prepared-statement issues with Supabase pooler (port 6543)
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0

# Your Supabase Database Username
spring.datasource.username=postgres.qscofupciqkxcklhocxy

# Your Supabase Database Password
spring.datasource.password=vJ0ddaSJvOCScCMV

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Tells Spring Boot to use PostgreSQL logic
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' automatically creates or updates database tables based on your Java Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows formatted SQL commands running in your VS Code console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SECURITY / JWT CONFIGURATION
# ===================================================================
# This fills the exact value your JwtUtil class is looking for to fix the startup crash
creditor.jwt.secret=superSecretKeyThatIsAtLeast32CharactersLongToKeepCrediTORSecure2026!

# Sets the token expiration time (e.g., 24 hours). 
creditor.jwt.expiry-hours=24

# ===================================================================
# FILE UPLOAD CONFIGURATION
# ===================================================================
# Tells your FileStorageService where to save uploaded files locally.
# This creates an 'uploads' folder right inside your project directory.
creditor.upload.dir=uploads

# Optional local secrets (gitignored): application-secrets.properties
spring.config.import=optional:classpath:application-secrets.properties

# ===================================================================
# OCR.space — TOR photo verification (free tier)
# Get a key: https://ocr.space/ocrapi/freekey
# Key: application-secrets.properties (auto-imported) or env OCR_SPACE_API_KEY / CREDITOR_OCRSPACE_API_KEY
# ===================================================================
creditor.ocrspace.max-image-edge=${OCR_SPACE_MAX_IMAGE_EDGE:1200}
creditor.ocrspace.engine=${OCR_SPACE_ENGINE:2}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB